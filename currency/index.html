<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="pageTitle">Currency Converter</title>

<link rel="stylesheet" href="/assets/css/style.css">

<style>
body{
font-family:system-ui,Arial;
background:#f3f4f6;
margin:0;
padding:0;
}

.container{
max-width:500px;
margin:60px auto;
background:white;
padding:30px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
text-align:center;
}

h1{
margin-bottom:20px;
}

.rate{
font-size:28px;
font-weight:700;
margin:20px 0;
}

button{
background:#3b82f6;
border:none;
color:white;
padding:12px 18px;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#2563eb;
}
</style>

</head>

<body>

<div class="container">

<h1 id="title">Currency Converter</h1>

<div id="loading">Loading...</div>

<div class="rate" id="rate"></div>

<a id="converterLink">
<button>Open Converter</button>
</a>

</div>

<script>

const path = window.location.pathname
let slug = path.split("/")[2]

let from = "USD"
let to = "EUR"

if(slug && slug.includes("-to-")){
  [from,to] = slug.split("-to-")
  from = from.toUpperCase()
  to = to.toUpperCase()
}

document.getElementById("title").innerText =
from + " to " + to + " Exchange Rate"

document.getElementById("pageTitle").innerText =
from + " to " + to + " Exchange Rate | ToolStack"

document.getElementById("converterLink").href =
"/tools/finance/currency-converter?from="+from+"&to="+to


async function loadRate(){

try{

const res = await fetch(
"https://api.frankfurter.app/latest?from="+from+"&to="+to
)

const data = await res.json()

if(!data.rates || !data.rates[to]){
document.getElementById("loading").innerText =
"Currency pair not available"
return
}

const rate = data.rates[to]

document.getElementById("loading").style.display = "none"

document.getElementById("rate").innerText =
"1 " + from + " = " + rate + " " + to

}catch(err){

console.error(err)

document.getElementById("loading").innerText =
"Failed to load exchange rate"

}

}

loadRate()

</script>

</body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Rate Digest Admin</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        background: #0b0c10;
        color: #f5f5f7;
        padding: 20px;
      }
      .card {
        max-width: 900px;
        margin: auto;
        background: #14141c;
        padding: 24px;
        border-radius: 18px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
      }
      h1 {
        margin-top: 0;
        font-size: 24px;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 16px;
        margin-top: 16px;
      }
      .stat {
        background: #1b1c26;
        border-radius: 14px;
        padding: 14px;
      }
      .stat label {
        display: block;
        font-size: 12px;
        opacity: 0.7;
      }
      .stat strong {
        font-size: 20px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        font-size: 13px;
      }
      th, td {
        padding: 6px 4px;
        border-bottom: 1px solid #262637;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Rate Digest Admin</h1>
      <div id="status">Loading…</div>

      <div class="grid" id="topStats" style="display:none">
        <div class="stat">
          <label>Total subscribers</label>
          <strong id="totalSubs">–</strong>
        </div>
        <div class="stat">
          <label>Active</label>
          <strong id="activeSubs">–</strong>
        </div>
        <div class="stat">
          <label>Unsubscribed</label>
          <strong id="unsubs">–</strong>
        </div>
      </div>

      <h3>Opens (last 7 days)</h3>
      <table id="opensTable">
        <thead>
          <tr><th>Date</th><th>Kind</th><th>Count</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <h3>Clicks (last 7 days)</h3>
      <table id="clicksTable">
        <thead>
          <tr><th>Date</th><th>Kind</th><th>Link</th><th>Count</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script>
      async function load() {
        try {
          const res = await fetch("/functions/api/admin-digest");
          const data = await res.json();
          if (!data.ok) throw new Error(data.error || "Error");
          const s = data.stats;

          document.getElementById("status").textContent = "OK";
          document.getElementById("topStats").style.display = "grid";

          document.getElementById("totalSubs").textContent =
            s.totalSubscribers;
          document.getElementById("activeSubs").textContent =
            s.activeSubscribers;
          document.getElementById("unsubs").textContent = s.unsubscribed;

          const openBody = document.querySelector(
            "#opensTable tbody"
          );
          openBody.innerHTML = "";
          s.opens.forEach((o) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${o.date_key}</td><td>${o.kind}</td><td>${o.count}</td>`;
            openBody.appendChild(tr);
          });

          const clickBody = document.querySelector(
            "#clicksTable tbody"
          );
          clickBody.innerHTML = "";
          s.clicks.forEach((c) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${c.date_key}</td><td>${c.kind}</td><td>${c.link_key}</td><td>${c.count}</td>`;
            clickBody.appendChild(tr);
          });
        } catch (e) {
          document.getElementById("status").textContent =
            "Failed to load admin stats.";
          console.error(e);
        }
      }

      load();
    </script>
  </body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Weekly Rate Digest</title>
  <style>
    body {
      margin: 0;
      background: #f7f7f8;
      font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
      color: #1c1c1e;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 28px;
      max-width: 620px;
      margin: auto;
      box-shadow: 0 4px 24px rgba(0,0,0,0.05);
    }
    h1 { font-size: 26px; margin: 0 0 12px; }
    td {
      padding: 10px 0;
      font-size: 17px;
      border-bottom: 1px solid #e5e5ea;
    }
    .chart {
      margin-top: 20px;
      text-align: center;
    }
    .footer {
      margin-top: 28px;
      font-size: 14px;
      color: #7a7a7c;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Weekly Rate Digest</h1>
    <div>Week Ending: <strong>{{DATE}}</strong></div>

    <table>
      <tr><td>USD → EUR</td><td><strong>{{USD_EUR}}</strong></td></tr>
      <tr><td>USD → GBP</td><td><strong>{{USD_GBP}}</strong></td></tr>
      <tr><td>USD → TRY</td><td><strong>{{USD_TRY}}</strong></td></tr>
      <tr><td>USD → AED</td><td><strong>{{USD_AED}}</strong></td></tr>
    </table>

    <div class="chart">
      <img src="{{CHART_DATA}}" width="100%" />
    </div>

    <div class="footer">
      Sent via EverydayTools.uk — Weekly Rate Digest
    </div>
  </div>
</body>
</html>

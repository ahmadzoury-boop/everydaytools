<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <!-- Strong SEO -->
  <title>Break Timer – Work/Rest Cycles for Productivity & Health</title>
  <meta name="description" content="Stay energized with this break timer. Schedule work/rest intervals, get reminders, and maintain healthy productivity habits with automatic cycles and notifications." />

  <!-- Canonical URL -->
  <link rel="canonical" href="https://mytools-56j.pages.dev/tools/time/break-timer.html" />

  <link rel="stylesheet" href="../../assets/css/style.css" />

  <style>
    .wrap{max-width:900px;margin:0 auto;padding:24px}
    .topnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
    .topnav a{opacity:.9;text-decoration:none}
    .card{padding:16px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12)}
    .big{font-size:56px;font-weight:900;letter-spacing:1px;line-height:1}
    .phase{font-size:18px;opacity:.9;margin-top:8px}
    .meta{margin-top:10px;opacity:.85;display:flex;flex-wrap:wrap;gap:12px}
    .controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    button{padding:10px 14px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.2);color:inherit;cursor:pointer}
    button.primary{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
    button:disabled{opacity:.5;cursor:not-allowed}
    .bar{height:10px;border-radius:999px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:12px}
    .fill{height:100%;width:0%}

    .row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:12px}
    label{display:block;font-size:.9rem;opacity:.9;margin-bottom:6px}
    input,select{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.15);color:inherit}
    .hint{opacity:.75;margin-top:10px;font-size:.9rem}
    .kbd{padding:2px 8px;border-radius:8px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.18)}
    @media (max-width:820px){.row{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>

  <script defer src="./break-timer.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="topnav">
      <a href="./index.html">← Back to Time Tools</a>
      <div style="opacity:.8">Break Timer</div>
    </div>

    <div class="card">
      <div class="big" id="time">00:00</div>
      <div class="phase" id="phase">Idle</div>

      <div class="bar"><div class="fill" id="fill"></div></div>

      <div class="meta">
        <div>Cycle: <b id="cycle">0</b>/<span id="cycleTotal">∞</span></div>
        <div>Mode: <b id="modeLabel">Work</b></div>
      </div>

      <div class="controls">
        <button class="primary" id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="resetBtn">Reset</button>

        <button class="primary" id="soundBtn">Sound: ON</button>
        <button id="fsBtn" title="Fullscreen (F)">Fullscreen</button>
      </div>

      <div class="hint">
        Shortcuts: <span class="kbd">Space</span> start/pause · <span class="kbd">R</span> reset · <span class="kbd">F</span> fullscreen.
        Audio works only after you click Start once.
      </div>
    </div>

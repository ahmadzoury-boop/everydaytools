<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Live Gold Price Tracker (Gram, Ounce, 24K) + Real-Time Market Charts</title>

  <!-- ✅ IMPROVED SEO -->
  <meta name="description" content="Track live gold prices in USD including per gram, ounce, kilogram, and karats (24K, 22K, 18K). View real-time XAUUSD charts with professional TradingView data, zoom, and market insights.">

  <link rel="canonical" href="https://everydaytools.uk/tools/finance/market-tracker/" />

  <meta name="keywords" content="gold price today, gold price per gram, 24k gold price, XAUUSD live chart, gold market tracker, real-time gold price, crypto charts, trading chart" />

  <meta property="og:title" content="Live Gold Price Tracker + Real Market Charts" />
  <meta property="og:description" content="Check real-time gold prices and explore professional charts powered by TradingView." />
  <meta property="og:url" content="https://everydaytools.uk/tools/finance/market-tracker/" />
  <meta property="og:type" content="website" />

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

<main class="max-w-6xl mx-auto px-4 py-8">

<header class="mb-6 flex justify-between items-center">
  <div>
    <h1 class="text-2xl md:text-3xl font-bold">Market & Gold Tracker</h1>

    <!-- ✅ IMPROVED PAGE DESCRIPTION -->
    <p class="text-slate-400 mt-2 max-w-xl">
      Track live gold prices in USD including ounce, gram, and karats (24K, 22K, 18K). 
      Explore real-time market charts powered by professional trading data with zoom, indicators, and interactive tools.
    </p>
  </div>

  <button id="themeToggle" class="bg-slate-800 px-3 py-2 rounded text-sm">
    Toggle Theme
  </button>
</header>

<!-- GOLD SECTION -->
<section class="bg-yellow-500/10 border border-yellow-500/20 rounded-xl p-6 mb-6">
  <h2 class="text-lg font-semibold text-yellow-400 mb-4">Gold Price</h2>

  <div class="grid md:grid-cols-5 gap-4">
    <div class="bg-slate-900 p-4 rounded text-center">
      <p class="text-sm text-slate-400">Ounce</p>
      <p id="goldOunce" class="text-xl font-bold">$—</p>
    </div>

    <div class="bg-slate-900 p-4 rounded text-center">
      <p class="text-sm text-slate-400">Gram</p>
      <p id="goldGramHero" class="text-xl font-bold">$—</p>
    </div>

    <div class="bg-slate-900 p-4 rounded text-center">
      <p class="text-sm text-slate-400">24K</p>
      <p id="gold24kHero" class="text-xl font-bold">$—</p>
    </div>

    <div class="bg-slate-900 p-4 rounded text-center">
      <p class="text-sm text-slate-400">22K</p>
      <p id="gold22kHero" class="text-xl font-bold">$—</p>
    </div>

    <div class="bg-slate-900 p-4 rounded text-center">
      <p class="text-sm text-slate-400">18K</p>
      <p id="gold18kHero" class="text-xl font-bold">$—</p>
    </div>
  </div>
</section>

<!-- SYMBOL SELECT -->
<div class="mb-4">
  <select id="symbolSelect" class="bg-slate-800 p-2 rounded">
    <option value="XAUUSD" selected>Gold</option>
    <option value="BTCUSDT">BTC</option>
    <option value="ETHUSDT">ETH</option>
  </select>
</div>

<!-- ✅ TRADINGVIEW CHART -->
<div class="bg-slate-900 p-4 rounded-xl">

  <div class="tradingview-widget-container">
    <div id="tradingview_chart"></div>
  </div>

</div>

</main>

<!-- TRADINGVIEW -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
new TradingView.widget({
  container_id: "tradingview_chart",
  width: "100%",
  height: 500,
  symbol: "OANDA:XAUUSD",
  interval: "60",
  timezone: "Etc/UTC",
  theme: "dark",
  style: "1",
  locale: "en",
  toolbar_bg: "#0f172a",
  enable_publishing: false,
  hide_side_toolbar: false,
  allow_symbol_change: true,
  studies: ["RSI@tv-basicstudies"]
});
</script>

<!-- GOLD PRICE FETCH -->
<script>
async function loadGold() {
  try {
    const res = await fetch("https://api.gold-api.com/price/XAU");
    const json = await res.json();

    const price = Number(json.price);
    const gram = price / 31.1035;

    document.getElementById("goldOunce").textContent = "$" + price.toFixed(2);
    document.getElementById("goldGramHero").textContent = "$" + gram.toFixed(2);
    document.getElementById("gold24kHero").textContent = "$" + gram.toFixed(2);
    document.getElementById("gold22kHero").textContent = "$" + (gram * 0.916).toFixed(2);
    document.getElementById("gold18kHero").textContent = "$" + (gram * 0.75).toFixed(2);

  } catch (e) {
    console.error("Gold load failed", e);
  }
}

loadGold();
</script>

<!-- THEME -->
<script>
let dark = true;

document.getElementById("themeToggle").onclick = () => {
  dark = !dark;

  document.body.className = dark
    ? "bg-slate-950 text-slate-100"
    : "bg-white text-black";
};
</script>

</body>
</html>

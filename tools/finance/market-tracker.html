<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white p-6">

<h1 class="text-2xl font-bold mb-4">Market Tracker</h1>

<!-- GOLD -->
<div class="mb-6">
  <h2>Gold</h2>
  <p id="gold">Loading...</p>
</div>

<!-- STOCKS -->
<div class="mb-6">
  <h2>Stocks</h2>
  <div id="stocks"></div>
</div>

<!-- ETFs -->
<div>
  <h2>ETFs</h2>
  <div id="etfs"></div>
</div>

<script>

const API_KEY = "bozVokwYzFEfXoElw2eCEMQMpEFa0qPO";

const STOCKS = ["AAPL","TSLA","NVDA"];
const ETFS = ["SPY","QQQ"];

async function fetchGold(){
  try{
    const res = await fetch("https://api.gold-api.com/price/XAU");
    const data = await res.json();
    document.getElementById("gold").textContent = "$"+data.price;
  }catch(e){
    document.getElementById("gold").textContent = "Error";
  }
}

async function fetchMarket(symbols,id){
  try{
    const res = await fetch(
      `https://financialmodelingprep.com/api/v3/quote/${symbols.join(",")}?apikey=${API_KEY}`
    );

    const data = await res.json();

    document.getElementById(id).innerHTML =
      data.map(x => `<div>${x.symbol} - $${x.price}</div>`).join("");

  }catch(e){
    document.getElementById(id).innerHTML = "Error";
  }
}

fetchGold();
fetchMarket(STOCKS,"stocks");
fetchMarket(ETFS,"etfs");

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Market Tracker | Gold, Stocks & ETFs</title>
<meta name="description" content="Track live gold prices, stocks, and ETFs with interactive charts." />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body class="bg-slate-950 text-white min-h-screen">

<div class="max-w-6xl mx-auto p-6">

<h1 class="text-3xl font-bold mb-6">📊 Market Tracker</h1>

<!-- GOLD -->
<div class="bg-slate-900 p-4 rounded-xl mb-6">
<h2 class="text-xl mb-2">🥇 Gold Price</h2>
<p id="goldPrice" class="text-2xl font-bold">Loading...</p>
</div>

<!-- STOCKS -->
<div class="bg-slate-900 p-4 rounded-xl mb-6">
<h2 class="text-xl mb-2">📈 Stocks</h2>
<div id="stocks" class="grid grid-cols-2 gap-4"></div>
</div>

<!-- ETF -->
<div class="bg-slate-900 p-4 rounded-xl mb-6">
<h2 class="text-xl mb-2">📊 ETFs</h2>
<div id="etfs" class="grid grid-cols-2 gap-4"></div>
</div>

<!-- CHART -->
<div class="bg-slate-900 p-4 rounded-xl">
<h2 class="text-xl mb-4">📉 Market Chart</h2>
<select id="symbol" class="mb-4 text-black p-2 rounded">
<option value="AAPL">Apple</option>
<option value="TSLA">Tesla</option>
<option value="SPY">SPY ETF</option>
<option value="QQQ">QQQ ETF</option>
<option value="GC=F">Gold</option>
</select>

<canvas id="chart"></canvas>

</div>

</div>

<script>

const symbols = ["AAPL", "TSLA", "SPY", "QQQ"];

// ================= GOLD =================
async function loadGold() {
  try {
    const res = await fetch("https://api.gold-api.com/price/XAU");
    const data = await res.json();

    document.getElementById("goldPrice").innerText =
      "$" + data.price.toFixed(2);

  } catch {
    document.getElementById("goldPrice").innerText = "Unavailable";
  }
}

// ================= STOCKS =================QQQ"
async function loadMarket() {
  const containerStocks = document.getElementById("stocks");
  const containerEtf = document.getElementById("etfs");

  containerStocks.innerHTML = "Loading...";
  containerEtf.innerHTML = "";

  try {
    const res = await fetch(
      "https://api.allorigins.win/raw?url=https://query1.finance.yahoo.com/v7/finance/quote?symbols=AAPL,TSLA,SPY,QQQ"
    );

    const data = await res.json();
    const results = data.quoteResponse.result;

    containerStocks.innerHTML = "";

    results.forEach(item => {
      const card = `
        <div class="bg-slate-800 p-3 rounded">
          <p>${item.symbol}</p>
          <p class="font-bold">$${item.regularMarketPrice}</p>
        </div>
      `;

      if (item.symbol === "SPY" || item.symbol === "QQQ") {
        containerEtf.innerHTML += card;
      } else {
        containerStocks.innerHTML += card;
      }
    });

  } catch (err) {
    console.log(err);
    containerStocks.innerHTML = "Market blocked (CORS)";
  }
}

// ================= CHART ==================1d`
async function loadChart(symbol = "AAPL") {

  try {
    const res = await fetch(
      `https://api.allorigins.win/raw?url=https://query1.finance.yahoo.com/v8/finance/chart/${symbol}?range=1mo&interval=1d`
    );

    const data = await res.json();

    const result = data?.chart?.result?.[0];
    if (!result) throw new Error("No data");

    let prices = result.indicators.quote[0].close;
    let timestamps = result.timestamp;

    const cleanData = prices
      .map((p, i) => (p ? { price: p, time: timestamps[i] } : null))
      .filter(x => x !== null);

    const cleanPrices = cleanData.map(x => x.price);
    const labels = cleanData.map(x => {
      const d = new Date(x.time * 1000);
      return d.toLocaleDateString();
    });

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels,
        datasets: [{
          label: symbol,
          data: cleanPrices,
          borderWidth: 2,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        plugins: {
          legend: {
            labels: { color: "white" }
          }
        },
        scales: {
          x: { ticks: { color: "white" } },
          y: { ticks: { color: "white" } }
        }
      }
    });

  } catch (err) {
    console.log("Chart error:", err);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: ["No data"],
        datasets: [{
          label: "Error",
          data: [0]
        }]
      }
    });
  }
}
  } catch (err) {
    console.log("Chart failed:", err);

    if (chart) chart.destroy();

    chart = new Chart(document.getElementById("chart"), {
      type: "line",
      data: {
        labels: ["Error"],
        datasets: [{
          label: "No data",
          data: [0]
        }]
      }
    });
  }
}

// ================= EVENT =================
document.getElementById("symbol").addEventListener("change", (e) => {
  loadChart(e.target.value);
});

// ================= INIT =================
loadGold();
loadMarket();
loadChart();

</script>

</body>
</html>

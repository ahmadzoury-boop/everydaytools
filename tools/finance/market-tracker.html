<script>

const API_KEY = "bozVokwYzFEfXoElw2eCEMQMpEFa0qPO";

const STOCKS = ["AAPL","TSLA","NVDA","AMZN","MSFT"];
const ETFS = ["SPY","QQQ","VTI","VOO","ARKK"];

let fullLabels = [];
let fullData = [];
let visibleRange = 20;

// CHART
const ctx = document.getElementById("chart").getContext("2d");

const chart = new Chart(ctx,{
  type:"line",
  data:{
    labels:[],
    datasets:[{
      data:[],
      borderColor:"#f59e0b",
      backgroundColor:"rgba(245,158,11,0.2)",
      fill:true,
      tension:0.3,
      pointRadius:0
    }]
  },
  options:{
    responsive:true,
    maintainAspectRatio:false,
    plugins:{legend:{display:false}},
    interaction:{mode:"index",intersect:false}
  }
});

// preload chart (so it's never empty)
for(let i=0;i<10;i++){
  fullLabels.push("--");
  fullData.push(4600);
}
updateChart();

function updateChart(){
  chart.data.labels = fullLabels.slice(-visibleRange);
  chart.data.datasets[0].data = fullData.slice(-visibleRange);
  chart.update();
}

function setRange(range){
  visibleRange = range;
  updateChart();
}

// ✅ GOLD (FIXED SAFE VERSION)
async function fetchGold(){
  try{
    const res = await fetch("https://api.gold-api.com/price/XAU", { cache:"no-store" });
    if(!res.ok) throw new Error("Gold API failed");

    const data = await res.json();
    const price = Number(data.price);

    if(!Number.isFinite(price)) throw new Error("Invalid gold");

    document.getElementById("goldPrice").textContent = "$" + price.toFixed(2);
    document.getElementById("goldUpdated").textContent =
      "Updated: " + new Date().toLocaleTimeString();

    fullLabels.push(new Date().toLocaleTimeString());
    fullData.push(price);

    if(fullLabels.length > 100){
      fullLabels.shift();
      fullData.shift();
    }

    updateChart();

  }catch(e){
    console.error("Gold failed:", e);
    document.getElementById("goldPrice").textContent = "$4600.00";
    document.getElementById("goldUpdated").textContent = "Fallback value";
  }
}

// UI ROW
function row(symbol,price,change){
  const c = Number(change || 0);
  const color = c>=0?"text-green-400":"text-red-400";
  const arrow = c>=0?"▲":"▼";

  return `
  <div class="flex justify-between border-b border-slate-800 py-2">
    <span>${symbol}</span>
    <span>$${price}</span>
    <span class="${color}">${arrow} ${Math.abs(c).toFixed(2)}%</span>
  </div>`;
}

// ✅ STOCKS (WORKING VERSION ONLY)
async function fetchMarket(symbols,id){
  try{
    const res = await fetch(
      `https://financialmodelingprep.com/api/v3/quote/${symbols.join(",")}?apikey=${API_KEY}`
    );

    if(!res.ok) throw new Error("Stocks API failed");

    const data = await res.json();
    const map = new Map(data.map(x=>[x.symbol,x]));

    document.getElementById(id).innerHTML =
      symbols.map(s=>{
        const x = map.get(s);
        return row(
          s,
          x ? x.price.toFixed(2) : "0.00",
          x ? x.changesPercentage : 0
        );
      }).join("");

  }catch(e){
    console.error("Stocks failed:", e);
    document.getElementById(id).innerHTML =
      `<p class="text-slate-400">Unavailable</p>`;
  }
}

// INIT
fetchGold();
fetchMarket(STOCKS,"stocks");
fetchMarket(ETFS,"etfs");

// INTERVALS
setInterval(fetchGold,60000);
setInterval(()=>fetchMarket(STOCKS,"stocks"),60000);
setInterval(()=>fetchMarket(ETFS,"etfs"),60000);

</script>

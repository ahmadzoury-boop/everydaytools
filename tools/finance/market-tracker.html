<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market & Gold Tracker</title>
  <meta name="description" content="Track live market prices with interactive charts for crypto, indices, and gold." />
  <meta name="google-site-verification" content="google5058cfec8bee90e0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>

  <style>
    body {
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
  </style>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen">

<main class="max-w-6xl mx-auto px-4 py-8">

<header class="mb-6">
  <h1 class="text-2xl md:text-3xl font-bold">Market & Gold Tracker</h1>
  <p class="text-slate-400 mt-1">Live snapshot with interactive chart, zoom, and pan.</p>
</header>

<section class="grid md:grid-cols-4 gap-4 mb-6">
  <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-xl p-4">
    <label class="text-sm text-slate-300">Symbol</label>
    <select id="symbolSelect" class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      <option value="BTCUSDT">BTC/USDT</option>
      <option value="ETHUSDT">ETH/USDT</option>
      <option value="XAUUSD">XAU/USD (Gold)</option>
    </select>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
    <label class="text-sm text-slate-300">Interval</label>
    <select id="intervalSelect" class="w-full mt-2 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2">
      <option value="1m">1m</option>
      <option value="5m">5m</option>
      <option value="15m">15m</option>
      <option value="1h" selected>1h</option>
      <option value="4h">4h</option>
      <option value="1d">1d</option>
    </select>
  </div>

  <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-end">
    <button id="refreshBtn" class="w-full bg-blue-600 hover:bg-blue-500 rounded-lg px-3 py-2 font-semibold">
      Refresh
    </button>
  </div>
</section>

<section class="grid md:grid-cols-4 gap-4 mb-6">
  <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
    <p class="text-slate-400 text-sm">Current Price</p>
    <p id="currentPrice" class="text-2xl font-bold mt-1">—</p>
  </article>

  <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
    <p class="text-slate-400 text-sm">24h Change</p>
    <p id="change24h" class="text-2xl font-bold mt-1">—</p>
  </article>

  <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
    <p class="text-slate-400 text-sm">24h High</p>
    <p id="high24h" class="text-2xl font-bold mt-1">—</p>
  </article>

  <article class="bg-slate-900 border border-slate-800 rounded-xl p-4">
    <p class="text-slate-400 text-sm">24h Low</p>
    <p id="low24h" class="text-2xl font-bold mt-1">—</p>
  </article>
</section>

<section class="bg-slate-900 border border-slate-800 rounded-xl p-4">
  <div class="flex justify-between mb-3">
    <h2 id="chartTitle">Price Chart</h2>
    <button id="resetZoomBtn" class="text-sm bg-slate-800 px-3 py-1 rounded">
      Reset Zoom
    </button>
  </div>

  <div class="h-[420px]">
    <canvas id="marketChart"></canvas>
  </div>

  <p id="statusText" class="text-sm text-slate-400 mt-3"></p>
</section>

</main>

<script>
let chart;

async function fetchData(symbol, interval) {
  if (symbol === "XAUUSD") {
    return [];
  }

  const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=200`;

  const res = await fetch(url);
  const data = await res.json();

  return data.map(c => ({
    time: c[0],
    close: parseFloat(c[4])
  }));
}

function renderChart(symbol, series) {
  const ctx = document.getElementById("marketChart");

  if (chart) chart.destroy();

  const dataPoints = series.map(p => ({
    x: p.time,
    y: p.close
  }));

  chart = new Chart(ctx, {
    type: "line",
    data: {
      datasets: [{
        label: symbol,
        data: dataPoints,
        parsing: false,
        borderWidth: 2,
        tension: 0.35
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: {
          type: "time",
          ticks: { color: "white" }
        },
        y: {
          ticks: { color: "white" }
        }
      },
      plugins: {
        zoom: {
          pan: { enabled: true, mode: "x" },
          zoom: {
            wheel: { enabled: true },
            pinch: { enabled: true },
            mode: "x"
          }
        }
      }
    }
  });
}

async function load() {
  const symbol = document.getElementById("symbolSelect").value;
  const interval = document.getElementById("intervalSelect").value;

  const data = await fetchData(symbol, interval);
  renderChart(symbol, data);
}

document.getElementById("refreshBtn").onclick = load;
document.getElementById("symbolSelect").onchange = load;
document.getElementById("intervalSelect").onchange = load;

load();
</script>

</body>
</html>

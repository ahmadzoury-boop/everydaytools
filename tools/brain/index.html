<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Brain — EverydayTools</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b0f14;
  color: #e6e6e6;
}

.brain-page {
  padding: 16px;
  max-width: 420px;
  margin: 0 auto;
}

.brain-intro {
  font-size: 14px;
  opacity: .8;
  margin-bottom: 14px;
}

/* FILTERS */
.brain-filters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.brain-filters button {
  padding: 12px 0;
  border-radius: 14px;
  border: none;
  background: #1f8f3a;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

.brain-filters button.active {
  background: #26b44a;
}

/* STATUS */
.brain-status {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}

.brain-pill {
  background: #151b23;
  padding: 6px 10px;
  border-radius: 999px;
}

/* CARD */
.brain-card {
  background: #10161d;
  border-radius: 16px;
  padding: 16px;
}

.brain-difficulty {
  font-weight: 700;
  margin-bottom: 4px;
}

.brain-category {
  font-size: 13px;
  opacity: .7;
  margin-bottom: 10px;
}

.brain-question {
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 14px;
  min-height: 48px;
}

/* INPUT + BUTTONS */
input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #0b0f14;
  color: #fff;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
}

.btn-submit {
  background: #26b44a;
  color: #fff;
}

.btn-hint {
  background: #1f8f3a;
  color: #fff;
  margin-top: 6px;
}
</style>
</head>

<body>
<div class="brain-page">

  <div class="brain-intro">
    Every day resets at midnight (UTC). Complete Easy + Medium to build streaks.
  </div>

  <div class="brain-filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="easy">Easy</button>
    <button data-filter="medium">Medium</button>
    <button data-filter="hard">Hard</button>
  </div>

  <div class="brain-status">
    <div class="brain-pill">Resets in <span id="timer">--:--:--</span></div>
    <div class="brain-pill">🔥 Streak <span id="streak">0</span></div>
    <div class="brain-pill">Best <span id="best">0</span></div>
  </div>

  <div class="brain-card">
    <div class="brain-difficulty" id="difficulty"></div>
    <div class="brain-category" id="category"></div>
    <div class="brain-question" id="question"></div>

    <input id="answer" placeholder="Your answer" />
    <button class="btn-submit" id="submitBtn">Submit</button>
    <button class="btn-hint" id="hintBtn">💡 Show hint</button>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const DATA_URL = "/tools/brain/data/sets-2026-01-12_to_2026-02-10.json";
const STORE_KEY = "et_brain_v1";

let dailySet = null;
let currentFilter = "all";
let currentQuestion = null;
let solved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");

const todayKey = () => new Date().toISOString().slice(0,10);

/* TIMER */
function updateTimer() {
  const now = new Date();
  const next = Date.UTC(
    now.getUTCFullYear(),
    now.getUTCMonth(),
    now.getUTCDate() + 1
  );
  const d = next - Date.now();
  const h = String(Math.floor(d / 3600000)).padStart(2,"0");
  const m = String(Math.floor(d % 3600000 / 60000)).padStart(2,"0");
  const s = String(Math.floor(d % 60000 / 1000)).padStart(2,"0");
  document.getElementById("timer").textContent = `${h}:${m}:${s}`;
}
setInterval(updateTimer, 1000);
updateTimer();

/* LOAD DATA */
fetch(DATA_URL)
  .then(r => r.json())
  .then(json => {
    dailySet = json.sets.find(s => s.date === todayKey());
    pickQuestion();
  });

/* PICK QUESTION */
function pickQuestion() {
  if (!dailySet) {
    document.getElementById("question").textContent =
      "No challenge available today.";
    return;
  }

  if (currentFilter === "all") {
    currentQuestion = {
      level: "easy",
      theme: dailySet.theme,
      ...dailySet.easy
    };
  } else {
    currentQuestion = {
      level: currentFilter,
      theme: dailySet.theme,
      ...dailySet[currentFilter]
    };
  }

  render();
}

/* RENDER */
function render() {
  document.getElementById("difficulty").textContent =
    currentQuestion.level.toUpperCase();

  document.getElementById("category").textContent =
    currentQuestion.theme;

  document.getElementById("question").textContent =
    currentQuestion.prompt ||
    currentQuestion.clues?.join(" • ") ||
    "";
}

/* FILTERS */
document.querySelectorAll(".brain-filters button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".brain-filters button")
      .forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    pickQuestion();
  });
});

/* SUBMIT */
document.getElementById("submitBtn").onclick = () => {
  if (!currentQuestion) return;

  const d = todayKey();
  solved[d] ??= {};
  solved[d][currentQuestion.level] = true;

  localStorage.setItem(STORE_KEY, JSON.stringify(solved));
  updateStreak();
  alert("Saved ✔");
};

/* HINT */
document.getElementById("hintBtn").onclick = () => {
  alert(currentQuestion.hint || "No hint available.");
};

/* STREAK */
function updateStreak() {
  let streak = 0, best = 0;
  const days = Object.keys(solved).sort().reverse();

  for (const d of days) {
    if (solved[d]?.easy && solved[d]?.medium) {
      streak++;
      best = Math.max(best, streak);
    } else break;
  }

  document.getElementById("streak").textContent = streak;
  document.getElementById("best").textContent = best;
}
updateStreak();

});
</script>
</body>
</html>

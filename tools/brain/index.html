<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Brain – EverydayTools.uk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0d0d0d;
      --fg: #ffffff;
      --card: #1a1a1a;
      --accent: #4ea1ff; /* default blue */
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8f8f8;
        --fg: #111111;
        --card: #ffffff;
        --accent: #0066cc;
      }
    }

    body {
      margin: 0;
      font-family: "Inter", sans-serif;
      background: var(--bg);
      color: var(--fg);
      padding: 16px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 4px;
      font-weight: 700;
    }

    .sub {
      opacity: 0.6;
      margin-bottom: 24px;
    }

    .card {
      background: var(--card);
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 20px;
    }

    /* Difficulty row */
    .difficulty-row {
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, 1fr);
      margin-bottom: 10px;
    }

    .difficulty-btn {
      border: 1px solid var(--accent);
      background: transparent;
      color: var(--accent);
      padding: 8px 0;
      border-radius: 999px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
    }

    .difficulty-btn.active {
      background: var(--accent);
      color: #ffffff;
    }

    .timer {
      font-size: 14px;
      margin-top: 4px;
      opacity: 0.7;
    }

    /* Question card */
    .q-card {
      background: var(--card);
      padding: 18px;
      border-radius: 14px;
      margin-top: 4px;
    }

    #questionText {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 8px;
    }

    .answer-box {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #ffffff;
      color: #000000;
      box-sizing: border-box;
    }

    .submit-btn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .hint {
      margin-top: 10px;
      color: var(--accent);
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    #hintText {
      display: none;
      opacity: 0.85;
      margin-top: 8px;
      font-size: 14px;
    }

    #message {
      margin-top: 10px;
      font-size: 14px;
      font-weight: 600;
    }

    /* Theme buttons (blue / orange / gold) */
    .theme-card-title {
      font-size: 14px;
      margin-bottom: 8px;
      opacity: 0.8;
    }

    .theme-row {
      display: flex;
      gap: 8px;
    }

    .theme-btn {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid transparent;
      background: #333;
      color: #fff;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .theme-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .theme-btn.active {
      border-color: var(--accent);
    }

    .theme-blue .theme-dot {
      background: #4ea1ff;
    }

    .theme-orange .theme-dot {
      background: #ff8c32;
    }

    .theme-gold .theme-dot {
      background: #f4c542;
    }
  </style>
</head>
<body>
  <h1>Daily Brain</h1>
  <div class="sub">EverydayTools.uk</div>

  <!-- Difficulty + timer -->
  <div class="card">
    <div class="difficulty-row">
      <button id="btnEasy" class="difficulty-btn active" data-diff="easy">Easy</button>
      <button id="btnMedium" class="difficulty-btn" data-diff="medium">Medium</button>
      <button id="btnHard" class="difficulty-btn" data-diff="hard">Hard</button>
    </div>
    <div class="timer">
      Resets in <span id="resetTime">00:00:00</span> (UTC)
    </div>
  </div>

  <!-- Question card -->
  <div class="q-card">
    <div id="questionText">Loading...</div>

    <input
      id="answerInput"
      type="text"
      class="answer-box"
      placeholder="Your answer"
      autocomplete="off"
    />

    <button id="submitBtn" class="submit-btn">Submit</button>

    <div id="hintBtn" class="hint">
      <span>💡</span><span>Show hint</span>
    </div>
    <div id="hintText"></div>

    <div id="message"></div>
  </div>

  <!-- Theme selector: blue / orange / gold -->
  <div class="card">
    <div class="theme-card-title">Theme</div>
    <div class="theme-row">
      <button id="themeBlue" class="theme-btn theme-blue active">
        <span class="theme-dot"></span>
        Blue
      </button>
      <button id="themeOrange" class="theme-btn theme-orange">
        <span class="theme-dot"></span>
        Orange
      </button>
      <button id="themeGold" class="theme-btn theme-gold">
        <span class="theme-dot"></span>
        Golden
      </button>
    </div>
  </div>

  <!-- Logic -->
  <script src="./brain.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Brain – EverydayTools.uk</title>

  <!-- SEO -->
  <meta name="description" content="One daily brain challenge to boost focus, logic, memory, and speed. Global leaderboard included." />

  <!-- OpenGraph -->
  <meta property="og:title" content="Daily Brain – EverydayTools.uk" />
  <meta property="og:description" content="Boost your thinking with one challenge per day. Track your streak, score, and compete globally." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://everydaytools.uk/brain" />

  <!-- Styles -->
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #fafafa;
      color: #222;
      line-height: 1.5;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
      font-size: 28px;
    }

    .countdown {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
    }

    /* Difficulty Tabs */
    #difficultyTabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      justify-content: center;
    }

    #difficultyTabs button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #ececec;
      cursor: pointer;
      transition: 0.2s;
      font-size: 15px;
    }

    #difficultyTabs button:hover {
      background: #ddd;
    }

    /* Puzzle Card */
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 30px;
    }

    .category {
      font-size: 13px;
      color: #555;
      text-transform: uppercase;
    }

    .level {
      font-size: 16px;
      font-weight: bold;
    }

    .prompt {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 500;
    }

    input#answerInput {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }

    button#submitAnswerBtn {
      width: 100%;
      background: #3a86ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    button#submitAnswerBtn:hover {
      background: #256fe6;
    }

    #hintBtn {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: #3a86ff;
      cursor: pointer;
      font-size: 14px;
      text-decoration: underline;
    }

    #hintText {
      margin-top: 8px;
      font-style: italic;
      color: #555;
      min-height: 20px;
    }

    /* Leaderboards */
    h2 {
      margin-top: 30px;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .lb-list {
      padding-left: 20px;
      margin-top: 6px;
    }

    .lb-list li {
      margin-bottom: 6px;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .lb-list li em {
      font-size: 12px;
      color: #666;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table th, table td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    .center {
      text-align: center;
    }

  </style>
</head>

<body>
  <div class="container">

    <h1>🧠 Daily Brain</h1>
    <div class="countdown">
      Resets in <span id="countdownText">00:00:00</span> (UTC)
    </div>

    <!-- Difficulty Tabs -->
    <div id="difficultyTabs">
      <button data-level="easy">Easy</button>
      <button data-level="medium">Medium</button>
      <button data-level="hard">Hard</button>
    </div>

    <!-- Puzzle Card -->
    <div class="card">
      <div class="category" id="questionCategory">Category</div>
      <div class="level" id="questionLevel">EASY</div>
      <div class="prompt" id="questionText">Loading...</div>

      <input id="answerInput" placeholder="Your answer..." />

      <button id="submitAnswerBtn">Submit</button>

      <button id="hintBtn">💡 Show hint</button>
      <div id="hintText"></div>
    </div>

    <!-- Today's Result -->
    <h2>Today's Result</h2>
    <p>Score: <strong id="todayScoreText">0/30</strong></p>
    <p>Streak 🔥 <strong id="streakValue">0</strong></p>
    <p>Best <strong id="bestStreakValue">0</strong></p>

    <!-- Local Leaderboard -->
    <h2>🏆 Your Best Days</h2>
    <div id="localLeaderboard">Loading...</div>

    <!-- Global Leaderboard -->
    <h2>🌍 Global Leaderboard</h2>
    <div id="globalLeaderboard">Loading...</div>

  </div>

  <!-- JS -->
  <script src="brain.js"></script>

</body>
</html>

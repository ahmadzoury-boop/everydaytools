<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Brain — EverydayTools</title>

<style>
/* =========================
   GLOBAL RESET
========================= */
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b0f14;
  color: #e6e6e6;
}

/* =========================
   PAGE WRAPPER
========================= */
.brain-page {
  padding: 16px;
  max-width: 420px;
  margin: 0 auto;
}

/* =========================
   HEADER TEXT
========================= */
.brain-intro {
  font-size: 14px;
  opacity: 0.8;
  margin-bottom: 14px;
  line-height: 1.4;
}

/* =========================
   FILTER BUTTONS
========================= */
.brain-filters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.brain-filters button {
  padding: 12px 0;
  border-radius: 14px;
  border: none;
  background: #1f8f3a;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

.brain-filters button.active {
  background: #26b44a;
}

/* =========================
   STATUS BAR
========================= */
.brain-status {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  opacity: 0.85;
  margin-bottom: 14px;
}

.brain-pill {
  background: #151b23;
  padding: 6px 10px;
  border-radius: 999px;
}

/* =========================
   CARD
========================= */
.brain-card {
  background: #10161d;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.brain-difficulty {
  font-weight: 700;
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}

.brain-category {
  font-size: 13px;
  opacity: 0.7;
  margin-bottom: 10px;
}

.brain-question {
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 14px;
  min-height: 48px;
}

/* =========================
   INPUT & BUTTONS
========================= */
.brain-card input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #0b0f14;
  color: #fff;
  margin-bottom: 10px;
}

.brain-card button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  cursor: pointer;
}

.btn-submit {
  background: #26b44a;
  color: #fff;
  margin-bottom: 8px;
}

.btn-hint {
  background: #1f8f3a;
  color: #fff;
}

/* =========================
   MOBILE SAFETY
========================= */
@media (max-width: 480px) {
  body {
    overflow-x: hidden;
  }
}
</style>
</head>

<body>
<div class="brain-page">

  <div class="brain-intro">
    Every day resets at midnight (UTC). Complete challenges, build streaks, and track your progress.
  </div>

  <!-- FILTERS -->
  <div class="brain-filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="easy">Easy</button>
    <button data-filter="medium">Medium</button>
    <button data-filter="hard">Hard</button>
  </div>

  <!-- STATUS -->
  <div class="brain-status">
    <div class="brain-pill">Resets in <span id="resetTimer">--:--:--</span></div>
    <div class="brain-pill">🔥 Streak <span id="streak">0</span></div>
    <div class="brain-pill">Best <span id="best">0</span></div>
  </div>

  <!-- CARD -->
  <div class="brain-card">
    <div class="brain-difficulty" id="difficulty">EASY</div>
    <div class="brain-category" id="category">Music</div>
    <div class="brain-question" id="question"></div>

    <input type="text" placeholder="Your answer" />
    <button class="btn-submit">Submit</button>
    <button class="btn-hint">💡 Show hint</button>
  </div>

</div>

<script>
/* =========================
   DATA (SAMPLE)
========================= */
const QUESTIONS = {
  easy: {
    difficulty: "EASY",
    category: "Music",
    question: "Which instrument has 88 keys?"
  }
};

/* =========================
   RENDER
========================= */
function renderQuestion() {
  const q = QUESTIONS.easy;

  document.getElementById("difficulty").textContent = q.difficulty || "";
  document.getElementById("category").textContent = q.category || "";
  document.getElementById("question").textContent = q.question || "";
}

/* =========================
   RESET TIMER
========================= */
function updateResetTimer() {
  const now = new Date();
  const next = Date.UTC(
    now.getUTCFullYear(),
    now.getUTCMonth(),
    now.getUTCDate() + 1
  );
  const diff = next - Date.now();

  const h = String(Math.floor(diff / 3600000)).padStart(2, "0");
  const m = String(Math.floor((diff % 3600000) / 60000)).padStart(2, "0");
  const s = String(Math.floor((diff % 60000) / 1000)).padStart(2, "0");

  document.getElementById("resetTimer").textContent = `${h}:${m}:${s}`;
}

setInterval(updateResetTimer, 1000);
updateResetTimer();
renderQuestion();
</script>

</body>
</html>

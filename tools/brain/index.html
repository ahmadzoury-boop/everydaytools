<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Brain — EverydayTools</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b0f14;
  color: #e6e6e6;
}

.brain-page {
  padding: 16px;
  max-width: 420px;
  margin: 0 auto;
}

.brain-intro {
  font-size: 14px;
  opacity: .8;
  margin-bottom: 14px;
  text-align: center;
}

/* FILTERS */
.brain-filters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.brain-filters button {
  padding: 12px 0;
  border-radius: 14px;
  border: none;
  background: #1f8f3a;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
}

.brain-filters button.active { background: #26b44a; }
.brain-filters button.locked { opacity: .4; cursor: not-allowed; }

/* STATUS */
.brain-status {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  margin-bottom: 14px;
  justify-content: center;
}

.brain-pill {
  background: #151b23;
  padding: 6px 10px;
  border-radius: 999px;
}

/* CARD */
.brain-card {
  background: #10161d;
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.brain-difficulty { font-weight: 700; margin-bottom: 4px; }
.brain-category { font-size: 13px; opacity: .7; margin-bottom: 10px; }

.brain-question {
  font-size: 16px;
  line-height: 1.6;
  margin-bottom: 14px;
  white-space: pre-line;
  min-height: 48px;
}

/* INPUT + BUTTONS */
input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #0b0f14;
  color: #fff;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
}

.btn-submit { background: #26b44a; color: #fff; }
.btn-hint { background: #1f8f3a; color: #fff; margin-top: 6px; }

/* FEEDBACK + EXPLAIN */
.feedback {
  margin-top: 12px;
  font-size: 14px;
  text-align: center;
}

.explain-box {
  margin-top: 10px;
  background: #0b0f14;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 12px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.5;
  opacity: .95;
}

.explain-title {
  font-weight: 700;
  margin-bottom: 6px;
  opacity: .95;
}
</style>
</head>

<body>
<div class="brain-page">

  <div class="brain-intro">
    Every day resets at midnight (UTC). Complete Easy + Medium to unlock Hard and build streaks.
  </div>

  <div class="brain-filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="easy">Easy</button>
    <button data-filter="medium">Medium</button>
    <button data-filter="hard" id="hardBtn">Hard 🔒</button>
  </div>

  <div class="brain-status">
    <div class="brain-pill">⏳ <span id="timer">--:--:--</span></div>
    <div class="brain-pill">🔥 Streak <span id="streak">0</span></div>
    <div class="brain-pill">⭐ Score <span id="score">0</span></div>
  </div>

  <div class="brain-card">
    <div class="brain-difficulty" id="difficulty"></div>
    <div class="brain-category" id="category"></div>
    <div class="brain-question" id="question"></div>

    <input id="answer" placeholder="Your answer" />
    <button class="btn-submit" id="submitBtn">Submit</button>
    <button class="btn-hint" id="hintBtn">💡 Show hint</button>

    <div class="feedback" id="feedback"></div>

    <div class="explain-box" id="explainBox" style="display:none;">
      <div class="explain-title">Why?</div>
      <div id="explainText"></div>
    </div>
  </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const DATA_URL = "/tools/brain/data/sets-2026-01-12_to_2026-02-10.json";
const STORE_KEY = "et_brain_v3";

const POINTS = { easy: 10, medium: 20, hard: 30 };

let dailySet, currentFilter = "easy", currentQuestion;
let state = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");

const today = new Date().toISOString().slice(0,10);
state[today] ??= { solved:{}, attempts:{}, score:0, finished:{} };

function el(id){ return document.getElementById(id); }

function updateTimer(){
  const n=new Date();
  const t=Date.UTC(n.getUTCFullYear(),n.getUTCMonth(),n.getUTCDate()+1)-Date.now();
  el("timer").textContent =
    [t/36e5,(t/6e4)%60,(t/1e3)%60].map(v=>String(Math.floor(v)).padStart(2,"0")).join(":");
}
setInterval(updateTimer,1000); updateTimer();

fetch(DATA_URL).then(r=>r.json()).then(j=>{
  dailySet = j.sets.find(s=>s.date===today);
  pickQuestion();
  updateUI();
  updateStreak();
}).catch(()=> {
  el("question").textContent = "Failed to load today's challenge.";
});

function pickQuestion(){
  if(!dailySet){
    el("question").textContent = "No challenge available today.";
    return;
  }
  const lvl = currentFilter==="all" ? "easy" : currentFilter;
  currentQuestion = { level:lvl, theme:dailySet.theme, ...dailySet[lvl] };
  render();
  renderProgressState();
}

function render(){
  el("difficulty").textContent = currentQuestion.level.toUpperCase();
  el("category").textContent = currentQuestion.theme;

  let q="";
  if(currentQuestion.type==="odd")
    q="Which one does not belong?\n\n"+currentQuestion.options.join(" • ");
  else if(currentQuestion.type==="clues")
    q=currentQuestion.clues.join(" • ");
  else
    q=currentQuestion.prompt || "";

  el("question").textContent = q;
}

function norm(s){
  return String(s || "")
    .trim()
    .toUpperCase()
    .replace(/\s+/g, " ")
    .replace(/[£$€]/g, ""); // make money answers more forgiving
}

function acceptedSet(q){
  const arr = Array.isArray(q.accepted) ? q.accepted : [];
  return new Set(arr.map(norm));
}

function isLockedOut(level){
  const used = state[today].attempts[level] || 0;
  const maxA = currentQuestion.maxAttempts ?? 1;
  // If already finished (either solved or max attempts reached), lock input
  return !!state[today].finished[level] || used >= maxA;
}

function showExplain(text){
  el("explainText").textContent = text || "";
  el("explainBox").style.display = text ? "block" : "none";
}

function hideExplain(){
  el("explainBox").style.display = "none";
  el("explainText").textContent = "";
}

function renderProgressState(){
  const lvl = currentQuestion.level;
  const solvedLvl = !!state[today].solved[lvl];
  const used = state[today].attempts[lvl] || 0;
  const maxA = currentQuestion.maxAttempts ?? 1;
  const finished = !!state[today].finished[lvl] || used >= maxA;

  // Input & submit availability
  const lock = solvedLvl || finished;
  el("answer").disabled = lock;
  el("submitBtn").disabled = lock;
  el("submitBtn").style.opacity = lock ? 0.5 : 1;

  // Feedback
  if (solvedLvl) {
    el("feedback").textContent = `✅ Correct! +${POINTS[lvl]} pts`;
    showExplain(currentQuestion.explain || "");
  } else if (finished) {
    el("feedback").textContent = `❌ Wrong (${used}/${maxA}) — Answer: ${currentQuestion.answer}`;
    showExplain(currentQuestion.explain || "");
  } else if (used > 0) {
    el("feedback").textContent = `❌ Wrong (${used}/${maxA}) — Try again`;
    hideExplain();
  } else {
    el("feedback").textContent = "";
    hideExplain();
  }
}

/* FILTERS */
document.querySelectorAll(".brain-filters button").forEach(b=>{
  b.onclick=()=>{
    if(b.classList.contains("locked")) return;
    document.querySelectorAll(".brain-filters button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    currentFilter=b.dataset.filter;
    pickQuestion();
  };
});

/* SUBMIT */
el("submitBtn").onclick=()=>{
  if(!currentQuestion) return;

  const lvl=currentQuestion.level;

  if (isLockedOut(lvl)) {
    renderProgressState();
    return;
  }

  const raw = el("answer").value;
  const user = norm(raw);
  if(!user) return;

  state[today].attempts[lvl]=(state[today].attempts[lvl]||0)+1;

  const ok = acceptedSet(currentQuestion).has(user);

  if(ok){
    if(!state[today].solved[lvl]){
      state[today].solved[lvl]=true;
      state[today].score += POINTS[lvl];
    }
    state[today].finished[lvl] = true;
    el("answer").value = "";
  } else {
    const used = state[today].attempts[lvl];
    const maxA = currentQuestion.maxAttempts ?? 1;
    if (used >= maxA) {
      state[today].finished[lvl] = true;
    }
  }

  save();
  updateUI();
  updateStreak();
  renderProgressState();
};

/* HINT */
el("hintBtn").onclick=()=>{
  alert(currentQuestion?.hint || "No hint.");
};

function updateUI(){
  el("score").textContent=state[today].score;

  // Lock Hard until easy+medium solved
  const hardUnlocked = !!state[today].solved.easy && !!state[today].solved.medium;
  const hb=el("hardBtn");
  hb.classList.toggle("locked",!hardUnlocked);
  hb.textContent = hardUnlocked ? "Hard" : "Hard 🔒";
}

/* STREAK: counts consecutive days where easy+medium solved */
function updateStreak() {
  let streak = 0, best = 0;
  const days = Object.keys(state).sort().reverse();

  for (const d of days) {
    if (state[d]?.solved?.easy && state[d]?.solved?.medium) {
      streak++;
      best = Math.max(best, streak);
    } else break;
  }
  el("streak").textContent = streak;
}

function save(){
  localStorage.setItem(STORE_KEY,JSON.stringify(state));
}

});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Brain – EverydayTools.uk</title>

  <!-- SEO -->
  <meta name="description" content="One daily brain challenge to boost focus, logic, memory, and speed. Track your streak, score, achievements, and compete globally." />

  <!-- OpenGraph -->
  <meta property="og:title" content="Daily Brain – EverydayTools.uk" />
  <meta property="og:description" content="Boost your thinking with one challenge per day. Track your streak, score, and compete globally." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://everydaytools.uk/brain" />

  <!-- Styles -->
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #fafafa;
      color: #222;
      line-height: 1.5;
      transition: 0.3s;
    }

    body.dark {
      background: #121212;
      color: #eee;
    }

    body.dark .card {
      background: #1e1e1e;
      color: #eee;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 6px;
      font-size: 28px;
    }

    .countdown {
      text-align: center;
      font-size: 14px;
      color: #777;
      margin-bottom: 20px;
    }

    #darkModeToggle {
      position: fixed;
      top: 10px;
      right: 10px;
      background: #222;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      z-index: 10;
    }

    /* Difficulty Tabs */
    #difficultyTabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      justify-content: center;
    }

    #difficultyTabs button {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: none;
      background: #ececec;
      cursor: pointer;
      transition: 0.2s;
      font-size: 15px;
    }

    #difficultyTabs button:hover {
      background: #ddd;
    }

    body.dark #difficultyTabs button {
      background: #222;
      color: #ddd;
    }

    body.dark #difficultyTabs button:hover {
      background: #333;
    }

    /* Puzzle Card */
    .card {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      margin-bottom: 30px;
    }

    .category {
      font-size: 13px;
      color: #555;
      text-transform: uppercase;
    }

    .level {
      font-size: 16px;
      font-weight: bold;
    }

    .prompt {
      margin-top: 12px;
      font-size: 18px;
      font-weight: 500;
    }

    input#answerInput {
      width: 100%;
      padding: 10px;
      margin-top: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 16px;
    }

    body.dark input#answerInput {
      background: #1f1f1f;
      color: #eee;
      border: 1px solid #444;
    }

    button#submitAnswerBtn {
      width: 100%;
      background: #3a86ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    #hintBtn {
      margin-top: 10px;
      background: transparent;
      border: none;
      color: #3a86ff;
      cursor: pointer;
      font-size: 14px;
      text-decoration: underline;
    }

    #hintText {
      margin-top: 8px;
      font-style: italic;
      color: #555;
      min-height: 20px;
    }

    /* Leaderboards */
    h2 {
      margin-top: 30px;
      margin-bottom: 10px;
      font-size: 22px;
    }

    .lb-list {
      padding-left: 20px;
      margin-top: 6px;
    }

    .lb-list li {
      margin-bottom: 6px;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .lb-list li em {
      font-size: 12px;
      color: #666;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    table th, table td {
      padding: 8px;
      border-bottom: 1px solid #eee;
      text-align: left;
    }

    #shareBtn {
      margin-top: 12px;
      width: 100%;
      border: none;
      background: #34c759;
      color: white;
      padding: 10px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
    }

    /* Mobile */
    @media (max-width: 480px) {
      h1 { font-size: 22px; }
      .card { padding: 16px; }
      #difficultyTabs button { padding: 8px; font-size: 14px; }
      input#answerInput { font-size: 15px; }
      .lb-list li { font-size: 14px; }
    }
  </style>
</head>

<body>

<button id="darkModeToggle">🌙</button>

<div class="container">

  <h1>🧠 Daily Brain</h1>
  <div class="countdown">
    Resets in <span id="countdownText">00:00:00</span> (UTC)
  </div>

  <!-- Difficulty Tabs -->
  <div id="difficultyTabs">
    <button data-level="easy">Easy</button>
    <button data-level="medium">Medium</button>
    <button data-level="hard">Hard</button>
  </div>

  <!-- Puzzle Card -->
  <div class="card">
    <div class="category" id="questionCategory">Category</div>
    <div class="level" id="questionLevel">EASY</div>
    <div class="prompt" id="questionText">Loading...</div>

    <input id="answerInput" placeholder="Your answer..." />

    <button id="submitAnswerBtn">Submit</button>
    <button id="hintBtn">💡 Show hint</button>
    <div id="hintText"></div>
  </div>

  <!-- Today's Result -->
  <h2>Today's Result</h2>
  <p>Score: <strong id="todayScoreText">0/30</strong></p>
  <p>Streak 🔥 <strong id="streakValue">0</strong></p>
  <p>Best <strong id="bestStreakValue">0</strong></p>
  <p>Achievement: <strong id="streakMedal"></strong></p>

  <button id="shareBtn">Share My Score</button>

  <!-- Local Leaderboard -->
  <h2>🏆 Your Best Days</h2>
  <div id="localLeaderboard">Loading...</div>

  <!-- Global Leaderboard -->
  <h2>🌍 Global Leaderboard</h2>
  <div id="globalLeaderboard">Loading...</div>

</div>

<script src="brain.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Brain – EverydayTools.uk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Daily Brain – a short daily brain challenge on EverydayTools.uk." />

  <!-- Dark mode default -->
  <style>
    :root {
      color-scheme: dark;
      --brain-bg: #05050a;
      --brain-card: #101018;
      --brain-border: #222436;
      --brain-text: #f5f5ff;
      --brain-muted: #a0a4c0;
      --brain-primary: #3b82f6;
      --brain-primary-soft: rgba(59,130,246,.18);
      --brain-success: #4ade80;
      --brain-error: #f87171;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 55%, #000 100%);
      color: var(--brain-text);
    }

    .brain-page {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 16px 40px;
    }

    .brain-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .brain-header h1 {
      margin: 0;
      font-size: 2.1rem;
      display: flex;
      justify-content: center;
      gap: .5rem;
    }

    .brain-header small {
      color: var(--brain-muted);
      font-size: .85rem;
    }

    .brain-tabs {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .brain-tab-btn {
      border-radius: 999px;
      border: 1px solid var(--brain-border);
      background: #0f172a;
      color: var(--brain-muted);
      padding: 8px;
      cursor: pointer;
    }

    .brain-tab-btn.active {
      background: var(--brain-primary-soft);
      border-color: var(--brain-primary);
      color: var(--brain-text);
    }

    .brain-tab-btn.locked {
      opacity: .5;
      cursor: not-allowed;
    }

    .brain-card {
      background: rgba(15,23,42,.95);
      border-radius: 18px;
      border: 1px solid var(--brain-border);
      padding: 18px;
      margin-bottom: 22px;
    }

    .brain-card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .brain-help-text {
      color: var(--brain-muted);
      font-size: .9rem;
      margin-bottom: 12px;
    }

    .brain-question-card {
      border: 1px solid var(--brain-border);
      border-radius: 12px;
      padding: 10px;
      margin-bottom: 10px;
      background: #020617;
    }

    .brain-question-card input {
      width: 100%;
      border-radius: 999px;
      border: 1px solid var(--brain-border);
      padding: 8px 10px;
      background: #020617;
      color: var(--brain-text);
    }

    .brain-hint {
      margin-top: 4px;
      font-size: .8rem;
      color: var(--brain-muted);
      cursor: pointer;
    }

    .brain-hint-box {
      font-size: .8rem;
      color: var(--brain-muted);
      margin-top: 4px;
    }

    .hidden { display:none; }

    .brain-submit-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .brain-button-primary {
      border-radius: 999px;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      cursor: pointer;
      background: var(--brain-primary);
      color: white;
    }

    .brain-section {
      margin-top: 22px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .85rem;
    }

    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid rgba(148,163,184,.25);
    }

    th {
      color: var(--brain-muted);
      text-align: left;
    }
  </style>

  <script defer src="/tools/brain/brain.js"></script>


</head>

<body>
<main class="brain-page">

  <header class="brain-header">
    <h1>🧠 Daily Brain</h1>
    <small id="resetTimer">Resets in --:--:-- (UTC)</small>
  </header>

  <!-- Tabs -->
  <nav class="brain-tabs">
    <button class="brain-tab-btn active">Easy</button>
    <button class="brain-tab-btn locked">Medium</button>
    <button class="brain-tab-btn locked">Hard</button>
  </nav>

  <!-- Main card -->
  <section class="brain-card">
    <div class="brain-card-header">
      <h2>Daily Brain</h2>
      <div>Level: <strong>EASY</strong></div>
    </div>

    <p class="brain-help-text">
      Answer all questions. You can still move on even if you get some wrong.
    </p>

    <!-- REQUIRED BY brain.js -->
    <div id="questionsBox"></div>

    <div class="brain-submit-row">
      <button id="submitBtn" class="brain-button-primary">Submit Easy</button>
      <div id="level-summary" class="brain-help-text">
        You haven’t submitted Easy yet today.
      </div>
    </div>
  </section>

  <!-- Today -->
  <section class="brain-section">
    <h3>Today's Result</h3>
    <p>
      Score: <strong><span id="today-score">0</span></strong> ·
      <span id="streakBox">🔥 Streak: 0</span>
    </p>
    <p>
      Global name:
      <input id="playerName" placeholder="Player"
        style="background:#020617;border-radius:999px;border:1px solid var(--brain-border);padding:4px 8px;color:var(--brain-text);" />
    </p>
  </section>

  <!-- Best days -->
  <section class="brain-section">
    <h3>🏆 Your Best Days</h3>
    <div id="bestDays">Loading…</div>
  </section>

  <!-- Global leaderboard -->
  <section class="brain-section">
    <h3>🌍 Global Leaderboard</h3>
    <div id="globalLeaderboard">Loading…</div>
  </section>

</main>
</body>
</html>

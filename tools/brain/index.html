<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Daily Brain – EverydayTools.uk</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Daily Brain – a short daily brain challenge." />

  <style>
    :root {
      --bg-dark: #020617;
      --bg-card: #0f172a;
      --border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at top, #111827, #020617 60%);
      color: var(--text);
    }

    body.light-mode {
      background: #f8fafc;
      color: #0f172a;
    }

    .brain-page {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    small {
      color: var(--muted);
      font-size: .85rem;
    }

    #theme-toggle {
      border-radius: 999px;
      padding: 6px 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
    }

    body.light-mode #theme-toggle {
      background: #e5e7eb;
      color: #111;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      padding: 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--muted);
      cursor: pointer;
    }

    .tab.active {
      background: rgba(59,130,246,.2);
      border-color: var(--primary);
      color: var(--text);
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }

    body.light-mode .card {
      background: white;
      border-color: #d1d5db;
    }

    .question-card {
      margin-bottom: 12px;
    }

    input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: inherit;
    }

    .hint {
      margin-top: 6px;
      font-size: .8rem;
      color: var(--muted);
      cursor: pointer;
    }

    .submit-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      gap: 10px;
    }

    button.primary {
      padding: 10px 18px;
      border-radius: 999px;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
      font-weight: 600;
    }
  </style>

  <script defer src="/tools/brain/brain.js"></script>
</head>

<body>
<main class="brain-page">

  <header>
    <div>
      <h1>🧠 Daily Brain</h1>
      <small id="resetTimer">Resets in --:--:-- (UTC)</small>
    </div>
    <button id="theme-toggle">🌓</button>
  </header>

  <div class="tabs">
    <button class="tab active" data-level="easy">Easy</button>
    <button class="tab" data-level="medium">Medium</button>
    <button class="tab" data-level="hard">Hard</button>
  </div>

  <section class="card">
    <p id="level-summary">Question 1</p>

    <!-- REQUIRED -->
    <div id="questions"></div>

    <div class="submit-row">
      <button id="submitBtn" class="primary">Submit</button>
      <div>Score: <strong id="todayScore">0</strong></div>
    </div>
  </section>

</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Daily Brain — EverydayTools</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #0b0f14;
  color: #e6e6e6;
}

.brain-page {
  padding: 16px;
  max-width: 420px;
  margin: 0 auto;
}

.brain-intro {
  font-size: 14px;
  opacity: .8;
  margin-bottom: 14px;
}

.brain-filters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.brain-filters button {
  padding: 12px 0;
  border-radius: 14px;
  border: none;
  background: #1f8f3a;
  color: #fff;
  font-weight: 600;
}

.brain-filters button.active {
  background: #26b44a;
}

.brain-status {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  font-size: 13px;
  margin-bottom: 14px;
}

.brain-pill {
  background: #151b23;
  padding: 6px 10px;
  border-radius: 999px;
}

.brain-card {
  background: #10161d;
  border-radius: 16px;
  padding: 16px;
}

.brain-difficulty {
  font-weight: 700;
  margin-bottom: 4px;
}

.brain-category {
  font-size: 13px;
  opacity: .7;
  margin-bottom: 10px;
}

.brain-question {
  font-size: 16px;
  line-height: 1.5;
  margin-bottom: 14px;
  min-height: 48px;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: #0b0f14;
  color: #fff;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
}

.btn-submit { background: #26b44a; color: #fff; }
.btn-hint { background: #1f8f3a; color: #fff; margin-top: 6px; }

@media (max-width: 480px) {
  body { overflow-x: hidden; }
}
</style>
</head>

<body>
<div class="brain-page">

  <div class="brain-intro">
    Every day resets at midnight (UTC). Complete Easy + Medium to build streaks.
  </div>

  <!-- FILTERS -->
  <div class="brain-filters">
    <button class="active" data-filter="all">All</button>
    <button data-filter="easy">Easy</button>
    <button data-filter="medium">Medium</button>
    <button data-filter="hard">Hard</button>
  </div>

  <!-- STATUS -->
  <div class="brain-status">
    <div class="brain-pill">Resets in <span id="timer">--:--:--</span></div>
    <div class="brain-pill">🔥 Streak <span id="streak">0</span></div>
    <div class="brain-pill">Best <span id="best">0</span></div>
  </div>

  <!-- CARD -->
  <div class="brain-card">
    <div class="brain-difficulty" id="difficulty"></div>
    <div class="brain-category" id="category"></div>
    <div class="brain-question" id="question"></div>

    <input id="answer" placeholder="Your answer" />
    <button class="btn-submit" id="submitBtn">Submit</button>
    <button class="btn-hint" id="hintBtn">💡 Show hint</button>
  </div>

</div>

<script>
/* =========================
   CONFIG
========================= */
const DATA_URL = "./data/sets-2026-01-12_to_2026-02-10.json";
const STORE_KEY = "et_brain_v1";

/* =========================
   STATE
========================= */
let data = [];
let currentFilter = "all";
let currentQuestion = null;
let solved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");

/* =========================
   HELPERS
========================= */
const todayKey = () => new Date().toISOString().slice(0,10);

function nextResetTimer() {
  const now = new Date();
  const next = Date.UTC(
    now.getUTCFullYear(),
    now.getUTCMonth(),
    now.getUTCDate() + 1
  );
  const diff = next - Date.now();
  const h = String(Math.floor(diff / 3600000)).padStart(2,"0");
  const m = String(Math.floor(diff % 3600000 / 60000)).padStart(2,"0");
  const s = String(Math.floor(diff % 60000 / 1000)).padStart(2,"0");
  document.getElementById("timer").textContent = `${h}:${m}:${s}`;
}
setInterval(nextResetTimer, 1000);
nextResetTimer();

/* =========================
   LOAD DATA
========================= */
fetch(DATA_URL)
  .then(r => r.json())
  .then(json => {
    data = json;
    pickQuestion();
  });

/* =========================
   PICK QUESTION
========================= */
function pickQuestion() {
  const today = todayKey();
  const todays = data.filter(q => q.date === today);

  let pool = todays;
  if (currentFilter !== "all") {
    pool = todays.filter(q => q.level === currentFilter);
  }

  currentQuestion = pool[0] || null;
  render();
}

/* =========================
   RENDER
========================= */
function render() {
  if (!currentQuestion) {
    document.getElementById("question").textContent = "No challenge today.";
    return;
  }

  document.getElementById("difficulty").textContent =
    currentQuestion.level.toUpperCase();

  document.getElementById("category").textContent =
    currentQuestion.category;

  document.getElementById("question").textContent =
    currentQuestion.question;
}

/* =========================
   FILTERS
========================= */
document.querySelectorAll(".brain-filters button").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".brain-filters button")
      .forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    currentFilter = btn.dataset.filter;
    pickQuestion();
  };
});

/* =========================
   SUBMIT
========================= */
document.getElementById("submitBtn").onclick = () => {
  if (!currentQuestion) return;

  solved[todayKey()] ??= {};
  solved[todayKey()][currentQuestion.level] = true;
  localStorage.setItem(STORE_KEY, JSON.stringify(solved));
  alert("Saved ✔");
};

/* =========================
   STREAK LOGIC (Easy + Medium)
========================= */
function updateStreak() {
  let streak = 0, best = 0;
  const days = Object.keys(solved).sort().reverse();

  for (const d of days) {
    if (solved[d]?.easy && solved[d]?.medium) {
      streak++;
      best = Math.max(best, streak);
    } else break;
  }

  document.getElementById("streak").textContent = streak;
  document.getElementById("best").textContent = best;
}
updateStreak();
</script>
</body>
</html>
